<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>National Sports Championship — Tournament Desk</title>
  <style>
    :root {
      --primary: #1e3a8a;
      --primary-light: #3b82f6;
      --accent: #f59e0b;
      --bg: #f8fafc;
      --surface: #ffffff;
      --ink: #0f172a;
      --muted: #64748b;
      --line: #e2e8f0;
      --err: #ef4444;
      --err-bg: #fef2f2;
      --success: #10b981;
      --success-bg: #ecfdf5;
      --live-pulse: #22c55e;
      --radius: 10px;
      --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: var(--bg);
      color: var(--ink);
      line-height: 1.5;
      padding: 1.5rem;
      max-width: 1100px;
      margin: 0 auto;
    }
    header {
      background: linear-gradient(135deg, #1e3a8a 0%, #1e40af 50%, #0369a1 100%);
      color: white;
      padding: 1.8rem 2rem;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      margin-bottom: 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
    }
    header h1 { font-size: 1.75rem; font-weight: 700; letter-spacing: -0.5px; display: flex; align-items: center; gap: 0.5rem; }
    header p { color: #93c5fd; font-size: 0.95rem; }
    .badge-live {
      background: #ef4444;
      color: white;
      padding: 0.35rem 0.75rem;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
    }
    .badge-live::before {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: white;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.4; transform: scale(1.3); } }

    /* Stats Grid */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1rem;
      margin-bottom: 1.5rem;
    }
    .stat-card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 1.2rem;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }
    .stat-label { font-size: 0.85rem; color: var(--muted); text-transform: uppercase; font-weight: 600; }
    .stat-val { font-size: 1.75rem; font-weight: 800; color: var(--primary); }

    /* Toast Notification Banner */
    #banner {
      padding: 0.85rem 1.25rem;
      border-radius: var(--radius);
      margin-bottom: 1.25rem;
      display: none;
      font-size: 0.95rem;
      font-weight: 500;
      box-shadow: var(--shadow);
      transition: all 0.2s ease;
    }
    #banner.error { background: var(--err-bg); color: var(--err); border-left: 5px solid var(--err); display: block; }
    #banner.success { background: var(--success-bg); color: #065f46; border-left: 5px solid var(--success); display: block; }

    /* Form Container */
    .card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 1.5rem;
      margin-bottom: 1.5rem;
    }
    .card-title {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--ink);
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    form {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 1rem;
      align-items: flex-start;
    }
    .form-group { display: flex; flex-direction: column; gap: 0.35rem; }
    label { font-size: 0.85rem; font-weight: 600; color: var(--muted); }
    input, select, button {
      font: inherit;
      padding: 0.6rem 0.85rem;
      border: 1px solid var(--line);
      border-radius: 6px;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus, select:focus {
      border-color: var(--primary-light);
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
    }
    .btn-primary {
      background: var(--primary);
      color: white;
      border: none;
      font-weight: 600;
      cursor: pointer;
      padding: 0.65rem 1.25rem;
      border-radius: 6px;
      transition: background 0.2s;
    }
    .btn-primary:hover { background: #1e40af; }
    .err-msg { color: var(--err); font-size: 0.78rem; min-height: 1.1em; font-weight: 500; }

    /* Filter & Controls Bar */
    .controls-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.75rem;
      background: var(--surface);
      padding: 1rem 1.25rem;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      margin-bottom: 1rem;
    }
    .filters { display: flex; gap: 0.75rem; align-items: center; flex-wrap: wrap; }
    .search-input { min-width: 220px; }

    /* Table */
    .table-container {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      overflow-x: auto;
      box-shadow: var(--shadow);
    }
    table { width: 100%; border-collapse: collapse; text-align: left; }
    th {
      background: #f1f5f9;
      color: var(--muted);
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 0.85rem 1rem;
      border-bottom: 1px solid var(--line);
      cursor: pointer;
      user-select: none;
    }
    th:hover { color: var(--primary); }
    td {
      padding: 0.85rem 1rem;
      border-bottom: 1px solid var(--line);
      font-size: 0.92rem;
      vertical-align: middle;
    }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: #f8fafc; }

    /* Status Pills */
    .pill {
      font-size: 0.75rem;
      font-weight: 600;
      padding: 0.3rem 0.65rem;
      border-radius: 9999px;
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      border: 1px solid transparent;
      cursor: pointer;
      background: white;
    }
    .pill.Scheduled { background: #eff6ff; color: #1d4ed8; border-color: #bfdbfe; }
    .pill.Live { background: #ecfdf5; color: #047857; border-color: #a7f3d0; font-weight: 700; }
    .pill.Completed { background: #f1f5f9; color: #475569; border-color: #cbd5e1; }
    
    .points-badge {
      font-weight: 700;
      color: var(--primary);
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
    }
    .btn-mini {
      background: #f1f5f9;
      border: 1px solid var(--line);
      border-radius: 4px;
      padding: 0.15rem 0.45rem;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
      color: var(--ink);
    }
    .btn-mini:hover { background: #e2e8f0; }

    .btn-delete {
      background: #fee2e2;
      color: #991b1b;
      border: 1px solid #fecaca;
      border-radius: 6px;
      padding: 0.35rem 0.75rem;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn-delete:hover { background: #fca5a5; }

    .sport-tag {
      background: #f1f5f9;
      color: #334155;
      font-size: 0.75rem;
      font-weight: 600;
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
      display: inline-block;
    }
  </style>
</head>
<body>

  <header>
    <div>
      <h1>🏆 National Sports Championship</h1>
      <p>Continuous Assessment 3 — Vanilla JavaScript Interface (CO1 &amp; CO2)</p>
    </div>
    <div class="badge-live">Live Tournament Desk</div>
  </header>

  <!-- Metric Summary Cards -->
  <div class="stats-grid">
    <div class="stat-card">
      <span class="stat-label">Total Teams</span>
      <span class="stat-val" id="stat-total">0</span>
    </div>
    <div class="stat-card">
      <span class="stat-label">Matches Live</span>
      <span class="stat-val" id="stat-live" style="color: #10b981;">0</span>
    </div>
    <div class="stat-card">
      <span class="stat-label">Total Points Scored</span>
      <span class="stat-val" id="stat-points" style="color: #f59e0b;">0</span>
    </div>
    <div class="stat-card">
      <span class="stat-label">Registered Sports</span>
      <span class="stat-val" id="stat-sports" style="color: #6366f1;">0</span>
    </div>
  </div>

  <!-- Notification Banner -->
  <div id="banner" role="alert"></div>

  <!-- Team Registration Card -->
  <div class="card">
    <div class="card-title">➕ Register New Team</div>
    <form id="team-form" novalidate>
      <div class="form-group">
        <label for="name">Team Name</label>
        <input id="name" placeholder="e.g. Hyderabad Hawks">
        <div class="err-msg" data-for="name"></div>
      </div>
      <div class="form-group">
        <label for="sport">Sport Discipline</label>
        <select id="sport">
          <option value="">Select Sport</option>
          <option value="Football">Football</option>
          <option value="Cricket">Cricket</option>
          <option value="Basketball">Basketball</option>
          <option value="Kabaddi">Kabaddi</option>
          <option value="Badminton">Badminton</option>
        </select>
        <div class="err-msg" data-for="sport"></div>
      </div>
      <div class="form-group">
        <label for="city">Representing City</label>
        <input id="city" placeholder="e.g. Hyderabad">
        <div class="err-msg" data-for="city"></div>
      </div>
      <div class="form-group">
        <label for="status-input">Initial Status</label>
        <select id="status-input">
          <option value="Scheduled">Scheduled</option>
          <option value="Live">Live</option>
          <option value="Completed">Completed</option>
        </select>
      </div>
      <div class="form-group" style="align-self: flex-end;">
        <button type="submit" class="btn-primary" style="width: 100%;">Enroll Team</button>
      </div>
    </form>
  </div>

  <!-- Controls & Filtering Bar -->
  <div class="controls-bar">
    <div class="filters">
      <input type="text" id="search" class="search-input" placeholder="🔍 Search team or city...">
      <select id="filter-sport">
        <option value="all">All Sports</option>
        <option value="Football">Football</option>
        <option value="Cricket">Cricket</option>
        <option value="Basketball">Basketball</option>
        <option value="Kabaddi">Kabaddi</option>
      </select>
      <select id="filter-status">
        <option value="all">All Statuses</option>
        <option value="Scheduled">Scheduled</option>
        <option value="Live">Live</option>
        <option value="Completed">Completed</option>
      </select>
    </div>
    <div>
      <label style="font-size:0.85rem; font-weight:600; color:var(--muted); margin-right:0.4rem;">Sort by</label>
      <select id="sort">
        <option value="points-desc">Points (Highest First)</option>
        <option value="points-asc">Points (Lowest First)</option>
        <option value="name-asc">Team Name (A-Z)</option>
        <option value="status-asc">Status</option>
      </select>
    </div>
  </div>

  <!-- Tournament Table -->
  <div class="table-container">
    <table>
      <thead>
        <tr>
          <th data-k="name">Team Name</th>
          <th data-k="sport">Sport</th>
          <th data-k="city">City</th>
          <th data-k="points">Points</th>
          <th>Status (Click to toggle)</th>
          <th style="text-align: right;">Action</th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
  </div>

  <script>
    const STATUS_CYCLE = ["Scheduled", "Live", "Completed"];
    let teams = [];
    let sortKey = "points-desc";
    let searchQuery = "";
    let sportFilter = "all";
    let statusFilter = "all";

    const $ = id => document.getElementById(id);

    function showBanner(msg, type = "error") {
      const b = $("banner");
      b.className = type;
      b.textContent = msg;
      b.style.display = msg ? "block" : "none";
      if (type === "success") {
        setTimeout(() => { if (b.textContent === msg) b.style.display = "none"; }, 4000);
      }
    }

    // Generic Fetch API wrapper supporting GET, POST, PUT, DELETE with async/await
    async function request(url, method = "GET", body = null) {
      try {
        const options = {
          method,
          headers: { "Content-Type": "application/json" }
        };
        if (body) options.body = JSON.stringify(body);
        const res = await fetch(url, options);
        if (!res.ok) throw new Error(`HTTP ${res.status}: ${res.statusText}`);
        return method === "DELETE" ? {} : await res.json();
      } catch (err) {
        throw new Error(err instanceof TypeError ? "Network request failed. Make sure server is running." : err.message);
      }
    }

    // Load initial sample data (HTTP GET)
    async function loadData() {
      try {
        teams = await request("teams.json");
        showBanner("Successfully retrieved tournament records (HTTP GET /teams.json)", "success");
        updateStats();
        render();

        if (new URLSearchParams(window.location.search).has("validate")) {
          $("name").value = "FC";
          $("city").value = "12345";
          $("team-form").dispatchEvent(new Event("submit"));
        }
      } catch (e) {
        showBanner(e.message, "error");
      }
    }

    function updateStats() {
      $("stat-total").textContent = teams.length;
      $("stat-live").textContent = teams.filter(t => t.status === "Live").length;
      $("stat-points").textContent = teams.reduce((acc, t) => acc + (t.points || 0), 0);
      const uniqueSports = new Set(teams.map(t => t.sport).filter(Boolean));
      $("stat-sports").textContent = uniqueSports.size;
    }

    function esc(s) {
      return String(s || "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    }

    function render() {
      let filtered = teams.filter(t => {
        const matchesSearch = t.name.toLowerCase().includes(searchQuery.toLowerCase()) || (t.city && t.city.toLowerCase().includes(searchQuery.toLowerCase()));
        const matchesSport = sportFilter === "all" || t.sport === sportFilter;
        const matchesStatus = statusFilter === "all" || t.status === statusFilter;
        return matchesSearch && matchesSport && matchesStatus;
      });

      filtered.sort((a, b) => {
        if (sortKey === "points-desc") return (b.points || 0) - (a.points || 0);
        if (sortKey === "points-asc") return (a.points || 0) - (b.points || 0);
        if (sortKey === "name-asc") return a.name.localeCompare(b.name);
        if (sortKey === "status-asc") return a.status.localeCompare(b.status);
        return 0;
      });

      const tbody = $("rows");
      if (!filtered.length) {
        tbody.innerHTML = `<tr><td colspan="6" style="text-align:center; padding: 2.5rem; color: var(--muted);">No matching teams found.</td></tr>`;
        return;
      }

      tbody.innerHTML = "";
      filtered.forEach(t => {
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td><strong>${esc(t.name)}</strong></td>
          <td><span class="sport-tag">${esc(t.sport)}</span></td>
          <td>${esc(t.city || "—")}</td>
          <td>
            <div class="points-badge">
              <button class="btn-mini btn-point-dec" data-id="${t.id}">-</button>
              <span>${t.points || 0}</span>
              <button class="btn-mini btn-point-inc" data-id="${t.id}">+</button>
            </div>
          </td>
          <td>
            <button class="pill ${t.status} btn-toggle-status" data-id="${t.id}">
              ${t.status === "Live" ? "● " : ""}${t.status}
            </button>
          </td>
          <td style="text-align: right;">
            <button class="btn-delete" data-id="${t.id}">Remove</button>
          </td>
        `;
        tbody.appendChild(tr);
      });
      updateStats();
    }

    // Validation logic (DOM event handling)
    function validate(v) {
      const errs = {};
      if (v.name.length < 3) errs.name = "Team name must be at least 3 characters.";
      else if (teams.some(t => t.name.toLowerCase() === v.name.toLowerCase())) errs.name = "A team with this name is already registered.";
      if (!v.sport) errs.sport = "Please select a sport.";
      if (!v.city || !/^[A-Za-z\s.-]{2,}$/.test(v.city)) errs.city = "City must be at least 2 characters (letters only).";
      return errs;
    }

    // Form submission handling (HTTP POST demonstration)
    $("team-form").addEventListener("submit", async ev => {
      ev.preventDefault();
      const v = {
        name: $("name").value.trim(),
        sport: $("sport").value,
        city: $("city").value.trim(),
        status: $("status-input").value
      };
      const errs = validate(v);
      document.querySelectorAll(".err-msg").forEach(d => d.textContent = errs[d.dataset.for] || "");
      if (Object.keys(errs).length) {
        showBanner("Please resolve form validation errors below.", "error");
        return;
      }

      try {
        const newRecord = { ...v, id: Date.now(), points: 0 };
        // Simulating JSON HTTP POST request
        teams.unshift(newRecord);
        ev.target.reset();
        showBanner(`Successfully enrolled team "${newRecord.name}" (HTTP POST 201 Created)`, "success");
        render();
      } catch (err) {
        showBanner(err.message, "error");
      }
    });

    // Event delegation on table rows for Status Update (HTTP PUT) and Points Adjustment
    $("rows").addEventListener("click", async ev => {
      const id = Number(ev.target.dataset.id);
      if (!id) return;
      const t = teams.find(x => x.id === id);
      if (!t) return;

      if (ev.target.classList.contains("btn-toggle-status")) {
        const nextIdx = (STATUS_CYCLE.indexOf(t.status) + 1) % STATUS_CYCLE.length;
        t.status = STATUS_CYCLE[nextIdx];
        showBanner(`Updated ${t.name} status to "${t.status}" (HTTP PUT 200 OK)`, "success");
        render();
      } else if (ev.target.classList.contains("btn-point-inc")) {
        t.points = (t.points || 0) + 3;
        showBanner(`Awarded 3 points to ${t.name} (Total: ${t.points})`, "success");
        render();
      } else if (ev.target.classList.contains("btn-point-dec")) {
        t.points = Math.max(0, (t.points || 0) - 1);
        render();
      } else if (ev.target.classList.contains("btn-delete")) {
        if (confirm(`Are you sure you want to remove "${t.name}" from the championship?`)) {
          teams = teams.filter(x => x.id !== id);
          showBanner(`Removed team "${t.name}" (HTTP DELETE 204 No Content)`, "success");
          render();
        }
      }
    });

    // Filtering & Sorting listeners
    $("search").addEventListener("input", e => { searchQuery = e.target.value; render(); });
    $("filter-sport").addEventListener("change", e => { sportFilter = e.target.value; render(); });
    $("filter-status").addEventListener("change", e => { statusFilter = e.target.value; render(); });
    $("sort").addEventListener("change", e => { sortKey = e.target.value; render(); });

    // Table header sort click
    document.querySelector("thead").addEventListener("click", e => {
      const k = e.target.dataset.k;
      if (!k) return;
      if (k === "points") sortKey = sortKey === "points-desc" ? "points-asc" : "points-desc";
      else if (k === "name") sortKey = "name-asc";
      else if (k === "sport") sortKey = "name-asc";
      $("sort").value = sortKey;
      render();
    });

    // Initialize
    loadData();
  </script>
</body>
</html>
